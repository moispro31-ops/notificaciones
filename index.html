<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartAlarm Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Cabecera Móvil -->
        <header class="mobile-header">
            <div class="header-title">
                <h1><i class="fa-solid fa-clock-rotate-left"></i> Alertas Móvil</h1>
                <span id="estadoConexion" class="status-dot online"></span>
            </div>
            <button id="btnPermiso" class="btn-permiso" onclick="solicitarPermisoNotificaciones()">
                <i class="fa-solid fa-bell"></i> Activar
            </button>
        </header>

        <!-- Formulario Rápido -->
        <section class="card-section">
            <h2>Nuevo Recordatorio</h2>
            <form id="formRecordatorio" onsubmit="agregarRecordatorio(event)">
                <div class="input-box">
                    <input type="text" id="titulo" required placeholder="¿De qué te quieres acordar?">
                </div>

                <div class="input-row">
                    <div class="input-box">
                        <input type="datetime-local" id="fechaHora" required>
                    </div>
                    <div class="input-box select-box">
                        <select id="prioridad">
                            <option value="normal">Normal</option>
                            <option value="importante">Urgente</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-main">
                    <i class="fa-solid fa-plus"></i> Programar Alarma
                </button>
            </form>
        </section>

        <!-- Lista de Recordatorios -->
        <section class="card-section list-section">
            <div class="list-header">
                <h2>Pendientes</h2>
                <span id="contadorPendientes" class="badge-count">0</span>
            </div>
            <div id="listaRecordatorios" class="lista-recordatorios">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>
    </div>

    <!-- Audio de respaldo para cuando la pantalla está activa -->
    <audio id="audioAlarma" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto" loop></audio>

    <script src="script.js"></script>
</body>
</html>
